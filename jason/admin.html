<!doctype html><html lang="ru" data-skin="slate"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Jason · CRM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
[data-skin="slate"]{
  --bg:#0b1018;--panel:#141b26;--panel2:#1b2431;--line:#26303f;--tx:#e8eef6;--dim:#8a97ab;
  --accent:#5b8dd9;--accent2:#7fb0ff;--glow:rgba(91,141,217,.18);
  --s-grey:#28313f;--s-grey-t:#7d8a9c;--s-yellow:#3b3520;--s-yellow-t:#dcc47e;
  --s-red:#3b2626;--s-red-t:#e39d9d;--s-green:#22322a;--s-green-t:#92d2aa;
  --s-blue:#1e2c40;--s-blue-t:#8ab6ea;--s-violet:#2c2540;--s-violet-t:#b39ce0;
  --wm:rgba(255,255,255,.02);--head:linear-gradient(180deg,#131b28 0%,#0b1018 100%);
}
[data-skin="coal"]{
  --bg:#101110;--panel:#1a1c1a;--panel2:#232622;--line:#2e322d;--tx:#eceee9;--dim:#93998f;
  --accent:#4fa87a;--accent2:#6fc99a;--glow:rgba(79,168,122,.16);
  --s-grey:#2b2e2a;--s-grey-t:#8b9187;--s-yellow:#3a3520;--s-yellow-t:#dbc47f;
  --s-red:#3a2725;--s-red-t:#e3a09a;--s-green:#22321f;--s-green-t:#9ad39a;
  --s-blue:#1f2c34;--s-blue-t:#8cb9cc;--s-violet:#2c2738;--s-violet-t:#b6a2d8;
  --wm:rgba(255,255,255,.018);--head:linear-gradient(180deg,#191b19 0%,#101110 100%);
}
[data-skin="night"]{
  --bg:#0a0a14;--panel:#13131f;--panel2:#1a1a2b;--line:#242438;--tx:#e9e9f5;--dim:#8b8ba6;
  --accent:#7c6bf0;--accent2:#9d90ff;--glow:rgba(124,107,240,.22);
  --s-grey:#26263a;--s-grey-t:#8484a0;--s-yellow:#38321f;--s-yellow-t:#dcc57f;
  --s-red:#38222f;--s-red-t:#e59bb4;--s-green:#1e3128;--s-green-t:#8ad3ab;
  --s-blue:#1d2842;--s-blue-t:#8fb2f0;--s-violet:#2a2145;--s-violet-t:#b9a4f5;
  --wm:rgba(255,255,255,.025);--head:linear-gradient(180deg,#16162a 0%,#0a0a14 100%);
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.55 "Golos Text",-apple-system,system-ui,sans-serif;padding:0 0 70px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 15% -10%,var(--glow),transparent 60%),
             repeating-linear-gradient(135deg,var(--wm) 0 1px,transparent 1px 96px)}
header{position:sticky;top:0;background:var(--head);border-bottom:1px solid var(--line);padding:11px 22px;z-index:9;backdrop-filter:blur(10px);display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{display:inline-flex;align-items:center;gap:9px;vertical-align:middle}
.logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;font-size:12px;color:#0b1018;box-shadow:0 0 18px var(--glow)}
.brand b{font-size:15px;font-weight:800;letter-spacing:.3px}
.brand span{color:var(--dim);font-size:10px;letter-spacing:.16em;text-transform:uppercase;display:block;margin-top:-3px}
.tabs{display:inline-flex;gap:3px;flex-wrap:wrap;vertical-align:middle}
.tab{background:transparent;border:1px solid transparent;color:var(--tx);opacity:.75;border-radius:9px;padding:6px 13px;cursor:pointer;font:600 12.5px "Golos Text",sans-serif;transition:.15s}
.tab:hover{opacity:1;background:var(--panel)}
.tab.active{background:var(--accent);color:#0b1018;opacity:1;box-shadow:0 3px 14px var(--glow)}
.right{margin-left:auto;display:flex;gap:10px;align-items:center}
.upd{color:var(--dim);font-size:11px}
.skins{display:flex;gap:4px}
.sk{width:20px;height:20px;border-radius:6px;border:1px solid var(--line);cursor:pointer}
.sk[data-s="slate"]{background:linear-gradient(135deg,#0b1018,#5b8dd9)}
.sk[data-s="coal"]{background:linear-gradient(135deg,#101110,#4fa87a)}
.sk[data-s="night"]{background:linear-gradient(135deg,#0a0a14,#7c6bf0)}
main{max-width:1280px;margin:0 auto;padding:16px 22px;position:relative;z-index:1}
body.crm-wide main{max-width:1760px}
.view{display:none}.view.active{display:block}
h2{font:800 13.5px "Golos Text";letter-spacing:.07em;text-transform:uppercase;color:var(--tx);margin:20px 0 9px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2 .periods{display:flex;gap:3px;text-transform:none;letter-spacing:0}
.per{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:3px 10px;font-size:11.5px;cursor:pointer}
.per.active{background:var(--panel2);color:var(--tx);border-color:var(--accent)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 16px}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:7px 9px;font-size:12.5px;text-align:right}
th{color:var(--dim);font:600 10.5px "Golos Text";text-transform:uppercase;letter-spacing:.05em;text-align:right}
td:first-child,th:first-child{text-align:left}
tr.sum td{background:var(--panel2);font-weight:700}
.mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.funnel{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
@media(max-width:1100px){.funnel{grid-template-columns:repeat(3,1fr)}}
@media(max-width:620px){.funnel{grid-template-columns:repeat(2,1fr)}}
.fc{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 12px;position:relative;transition:.15s}
.fc:hover{border-color:var(--accent)}
.fc .t{color:var(--dim);font-size:11px;font-weight:600}
.fc .v{font:800 24px "Golos Text";margin:3px 0 1px}
.fc .d{font-size:11px}
.fc .tip{display:none;position:absolute;left:8px;top:calc(100% + 6px);background:var(--panel2);border:1px solid var(--accent);border-radius:9px;padding:8px 11px;font-size:11.5px;color:var(--tx);width:230px;z-index:20;font-weight:400}
.fc:hover .tip{display:block}
.up{color:var(--s-green-t)}.down{color:var(--s-red-t)}
.convrow{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:8px}
@media(max-width:800px){.convrow{grid-template-columns:repeat(2,1fr)}}
.cv{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.cv .t{color:var(--dim);font-size:11px}
.cv .v{font:700 17px "JetBrains Mono",monospace;margin-top:2px}
.mpick{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:3px 12px;font-size:11.5px;cursor:pointer;color:var(--tx);font-weight:600}
.mnav{background:var(--panel2);border:1px solid var(--accent);color:var(--accent2);border-radius:7px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:700}
.chip{display:inline-block;min-width:30px;padding:2px 7px;border-radius:6px;font-weight:700;font-size:11.5px}
.c-grey{background:var(--s-grey);color:var(--s-grey-t)}
.c-yellow{background:var(--s-yellow);color:var(--s-yellow-t)}
.c-red{background:var(--s-red);color:var(--s-red-t)}
.c-green{background:var(--s-green);color:var(--s-green-t)}
.c-blue{background:var(--s-blue);color:var(--s-blue-t)}
.c-violet{background:var(--s-violet);color:var(--s-violet-t)}
.legend{display:flex;gap:13px;flex-wrap:wrap;color:var(--dim);font-size:11.5px;margin:7px 0 12px}
.actions{display:flex;gap:7px;margin-top:9px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid transparent;border-radius:8px;padding:7px 14px;font:600 12.5px "Golos Text";cursor:pointer}
.ok-btn{background:var(--s-green);color:var(--s-green-t);border-color:#39543f}
.rw{background:var(--s-yellow);color:var(--s-yellow-t);border-color:#5a5330}
.ghost{background:var(--panel2);color:var(--dim);border-color:var(--line)}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent2);outline-offset:1px}
textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:9px;font:13px "Golos Text";min-height:54px}
input[type=text],input[type=number],input[type=date],input:not([type]){background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:6px 10px;font:13px "Golos Text"}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.toolbar .search{flex:1 1 200px;min-width:160px;max-width:340px}
input.search{background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--tx);padding:7px 12px;font:13px "Golos Text"}
select{background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--tx);padding:7px 10px;font:12.5px "Golos Text"}
.fbtn{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:20px;padding:5px 12px;font-size:11.5px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.fbtn.active{background:var(--panel2);color:var(--tx);border-color:var(--accent)}
.fbtn.empty{opacity:.55}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
.crm{display:grid;grid-template-columns:285px minmax(0,1fr);gap:11px;align-items:start}
@media(max-width:900px){.crm{grid-template-columns:1fr}}
.leadlist{background:var(--panel);border:1px solid var(--line);border-radius:11px;max-height:calc(100vh - 230px);overflow-y:auto}
.lead{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px;border-left:3px solid transparent;min-height:56px}
.lead.active{background:var(--panel2);border-left-color:var(--accent)}
.lead.wait{border-left-color:var(--s-red-t)}
.lead .nm{font-weight:700;display:flex;justify-content:space-between;gap:6px}
.lead .src{color:var(--dim);font-size:10.8px;margin-top:2px}
.lead .badge{font-size:10px;padding:1px 6px;border-radius:9px;background:var(--s-red-t);color:#fff;white-space:nowrap}
.lead .badge.cnt{background:var(--s-grey);color:var(--s-grey-t)}
.lead .task{font-size:10.5px;color:var(--s-yellow-t);margin-top:2px}
.lead .last{color:var(--dim);font-size:10.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cardp{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px}
.cardp .kv{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin:9px 0;font-size:12.5px}
.cardp .kv .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kv a{color:var(--accent2);text-decoration:none}
.board{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:9px;overflow-x:auto;padding-bottom:6px;align-items:start}
.bcol{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px;min-width:0;max-height:calc(100vh - 290px);overflow-y:auto}
.bcol h4{margin:0 0 7px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);display:flex;justify-content:space-between;gap:6px}
.bcard{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-bottom:6px;font-size:12px;cursor:pointer;border-left:3px solid transparent}
.bcard:hover{border-color:var(--accent)}
.bcard.wait{border-left-color:var(--s-red-t)}
.bcard .bn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard .bs{color:var(--dim);font-size:10.5px;margin-top:2px}
.logrow{font-size:11.5px;color:var(--dim);padding:3px 0;border-bottom:1px solid var(--line)}
.taskbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:9px 0}
.taskbar input[type=text]{flex:1;min-width:180px}
.taskbar input[type=date]{width:150px}
.chat{background:var(--panel2);border-radius:9px;padding:12px;height:min(58vh,700px);min-height:300px;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:7px;resize:vertical}
.msg{max-width:80%;padding:7px 11px;border-radius:11px;font-size:12.3px;overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap;min-width:0}
.them{background:#232c3a;color:var(--tx);align-self:flex-start;border-bottom-left-radius:3px}
.us{background:#3a4658;color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.msg small{display:block;color:var(--dim);font-size:9.8px;margin-top:2px}
.msgacts{float:right;margin-left:8px;opacity:.55}
.msg:hover .msgacts{opacity:1}
.msgacts .ma{color:inherit;margin-left:6px;cursor:pointer;user-select:none}
.msgacts .ma:hover{color:var(--accent2)}
.msg .tick{margin-left:6px;color:var(--accent2);font-size:11px;letter-spacing:-1px}
.msg.editing{max-width:100%!important;width:100%}
.delask{margin-top:8px;padding:8px 10px;background:var(--panel);border:1px solid var(--s-red-t);border-radius:9px;font-size:12.5px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mode button{background:var(--panel2);border:none;color:var(--dim);padding:6px 12px;font:600 11.5px "Golos Text";cursor:pointer}
.mode button.on{background:var(--accent);color:#0b1018}
.quals{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:9px 0 4px}
.ql{padding:4px 11px;border-radius:8px;font-size:11.5px;font-weight:600;cursor:pointer;border:1px solid currentColor;background:transparent;opacity:.6;transition:.12s}
.ql:hover{opacity:.9}
.ql.c-green{color:var(--s-green-t)}.ql.c-blue{color:var(--s-blue-t)}.ql.c-yellow{color:var(--s-yellow-t)}.ql.c-violet{color:var(--s-violet-t)}
.ql.on{opacity:1}
.ql.on.c-green{background:var(--s-green)}.ql.on.c-blue{background:var(--s-blue)}.ql.on.c-yellow{background:var(--s-yellow)}.ql.on.c-violet{background:var(--s-violet)}
.fbrow{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-top:5px;font-size:12px;cursor:pointer}
.fbrow .fbfull{display:none;white-space:pre-wrap;margin-top:6px;color:var(--dim)}
.fbrow.open .fbfull{display:block}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
@media(max-width:900px){.kanban{grid-template-columns:repeat(2,1fr)}}
.col{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px}
.col h4{font:700 11px "Golos Text";color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}
.col[data-c="0"]{background:linear-gradient(180deg,rgba(120,140,170,.08),transparent)}
.col[data-c="1"]{background:linear-gradient(180deg,rgba(110,170,230,.10),transparent)}
.col[data-c="2"]{background:linear-gradient(180deg,rgba(220,196,126,.10),transparent)}
.col[data-c="3"]{background:linear-gradient(180deg,rgba(146,210,170,.10),transparent)}
.task{background:var(--panel2);border-radius:8px;padding:8px 10px;font-size:12.3px;margin-bottom:6px;border-left:3px solid var(--accent)}
.task .who{color:var(--dim);font-size:10.5px;margin-top:3px}
.task.overdue{border-left:3px solid var(--s-red-t)}
.note{color:var(--dim);font-size:11.8px;margin-top:8px;max-width:82ch}
.q{background:var(--panel2);border-left:3px solid var(--s-yellow-t);border-radius:9px;padding:10px 12px;font-size:12.3px;margin-top:10px}
.utable{width:100%;table-layout:fixed}
.utable td,.utable th{vertical-align:top;text-align:left}
.utable .acc{font-size:11.5px;line-height:1.5;color:var(--dim)}
.ilink{color:var(--accent2);text-decoration:underline;font-size:11.5px}
.iconbtn{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:2px 7px;cursor:pointer;font-size:12px;margin-left:4px}
.iconbtn:hover{color:var(--accent2);border-color:var(--accent)}
.calpop,.tmodal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:50}
.calpop.open,.tmodal.open{display:grid}
.calbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:300px}
.calbox h3{font-size:14px;margin-bottom:10px}
.calgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.calm{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 4px;text-align:center;cursor:pointer;font-size:12px}
.calm:hover{border-color:var(--accent);color:var(--accent2)}
.calyr{display:flex;justify-content:center;gap:14px;align-items:center;margin-bottom:6px}
.calcustom{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap;font-size:12px}
.tbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(480px,92vw)}
.tbox input,.tbox textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:7px 10px;font-size:13px;margin:4px 0}
.tbox label{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.asknear{position:absolute;z-index:60;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--accent2);border-radius:10px;padding:8px 11px;font-size:12.5px;color:var(--tx);box-shadow:0 8px 26px rgba(0,0,0,.45)}
.asknear .btn{padding:4px 12px;font-size:12px}
.askinput{flex-wrap:wrap;max-width:340px}
.askinput label{width:100%;color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.askinput input{width:100%;margin:3px 0 5px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:11px 18px;font-size:13px;color:var(--tx);opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:80vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.dot-on{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--s-green-t);margin-left:4px;vertical-align:1px}
.health{position:sticky;top:0;z-index:99;background:#5b1f1f;color:#ffe9c7;padding:8px 14px;font-size:13px}
@media(max-width:780px){
  header{padding:9px 13px;gap:7px 10px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%;order:3;width:100%;padding-bottom:2px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:6px 11px;font-size:12px}
  .right{margin-left:auto;order:2}.skins{display:none}
  .box{padding:11px}main{padding:12px 13px}
  .convrow{grid-template-columns:1fr !important}
  .kanban{grid-template-columns:1fr !important}
  .chiprow{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
}
/* --- Jason CRM additions --- */
.funnel{grid-template-columns:repeat(4,1fr)}@media(max-width:620px){.funnel{grid-template-columns:repeat(2,1fr)}}
header[hidden]{display:none}
.hint{color:var(--dim);font-size:11.5px;font-weight:400;text-transform:none;letter-spacing:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.who{color:var(--dim);font-size:12px}
.sect{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.sect .st,summary.st{font:700 10.5px "Golos Text";color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;cursor:default}
summary.st{cursor:pointer}
.chat{height:min(40vh,420px);min-height:180px}
.cb{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--tx);margin-right:8px;cursor:pointer}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.bar{height:7px;border-radius:9px;background:var(--accent)}
.fc .d{display:block;color:var(--dim)}
.fc .d.up{color:var(--s-green-t)}.fc .d.down{color:var(--s-red-t)}
body.auth{display:grid;place-items:center;min-height:100vh;padding:0}
body.auth main{max-width:none;padding:16px}
